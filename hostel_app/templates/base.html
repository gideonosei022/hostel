<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Rental Property Platform{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 15px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
            padding: 6px 8px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        hr {
            margin: 20px 0;
        }

        form {
            max-width: 100%;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            body {
                margin: 10px;
            }

            h1 {
                font-size: 22px;
            }

            nav {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🏠 Rental Property Management System</h1>
</header>

<nav>
    <a href="{% url 'property_list' %}">Home</a>
    <a href="{% url 'favorite_list' %}">Saved Properties</a>

    {% if user.is_authenticated %}
        <a href="{% url 'owner_dashboard' %}">Owner Dashboard</a>
        <a href="{% url 'owner_logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'owner_login' %}">Login</a>
        <a href="{% url 'owner_register' %}">Register</a>
    {% endif %}
</nav>

<hr>

{% block content %}{% endblock %}

</body>
</html>
